    # Удаляем торренты с ratio < 0.5 (жадные сиды)
    remove_greedy_seeds:
      remove: ratio < 0.5 and last_activity > 1296000 and size > 1
      excluded_trackers:
        - plab.site
    
    # Удаляем неактивные торренты, которые уже достаточно отдали
    remove_inactive_with_slow_speed:
      remove: last_activity > 604800 and average_uploadspeed < 1024 and size > 1 
      excluded_trackers:
        - plab.site

    # Удаляем старые закачки более 3 мес, у которых уже низкая средняя скорость отдачи
    remove_older_with_slow_speed:
#      remove: average_uploadspeed < 0.256 and seeding_time > 31536000
      remove: average_uploadspeed < 0.512 and seeding_time > 7884000
      excluded_trackers:
        - plab.site

    # plab
    remove_older_plab:
      remove: average_uploadspeed < 0.128 and seeding_time > 31536000
      trackers:
        - plab.site

  # Part 4: Decide whether to remove and delete data (optional)
  delete_data: true

